name: tgc_maker
description: Open-source Flutter framework for creating holographic TGC cards with parallax and shader effects.
version: 0.1.0
homepage: https://github.com/tgcmaker/tgc-maker
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sensors_plus: ^7.0.0
  image_picker: ^1.2.2
  share_plus: ^11.0.0
  path_provider: ^2.1.5
  image_background_remover: ^2.0.0
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/demo/
    - assets/images/ui/
    - assets/cards/
    - assets/frames/
    - packages/image_background_remover/assets/model.onnx

  shaders:
    - assets/shaders/holographic.frag
    - assets/shaders/sparkle.frag
    - assets/shaders/pixel_foil.frag
    - assets/shaders/rainbow_foil.frag
    - assets/shaders/oil_slick.frag
    - assets/shaders/sequins.frag
